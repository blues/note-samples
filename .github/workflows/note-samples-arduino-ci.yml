name: note-samples-arduino-ci

on:
  push:
    branches: [main]
    paths:
      - "arduino-note-array/**"
      - "esp32-dfu/**"
      - ".github/workflows/note-samples-arduino-ci.yml"
  pull_request:
    paths:
      - "arduino-note-array/**"
      - "esp32-dfu/**"
      - ".github/workflows/note-samples-arduino-ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  esp32-dfu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Compile esp32-dfu
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:featheresp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - name: Blues Wireless Notecard
          sketch-paths: |
            - esp32-dfu

  arduino-note-array:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build arduino-note-array
        run: pio run -d arduino-note-array/arduino-note-array
